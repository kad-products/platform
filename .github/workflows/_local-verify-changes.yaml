name: Verify Changes

on:
  pull_request:
    branches: [main]

jobs:
  lint-code:
    uses: ./.github/workflows/lint-code.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit

  test-github-environment:
    uses: ./.github/workflows/test-open-tofu.yaml
    permissions:
      contents: read
    with:
      working_directory: open-tofu/modules/github-environment

  test-github-repo:
    uses: ./.github/workflows/test-open-tofu.yaml
    permissions:
      contents: read
    with:
      working_directory: open-tofu/modules/github-repo
