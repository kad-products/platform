name: Verify Changes

on:
  pull_request:
    branches: [main]

jobs:
  lint-code:
    uses: ./.github/workflows/lint-code.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit

  test-github-environment:
    uses: ./.github/workflows/test-open-tofu.yaml
    permissions:
      contents: read
    with:
      working-directory: open-tofu/modules/github-environment

  test-github-repo:
    uses: ./.github/workflows/test-open-tofu.yaml
    permissions:
      contents: read
    with:
      working-directory: open-tofu/modules/github-repo

  test-cli:
    uses: ./.github/workflows/run-tests.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      working-directory: ./cli

  lint-cli:
    uses: ./.github/workflows/lint-code.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      working-directory: ./cli

  plan-github-setup:
    uses: ./.github/workflows/plan-open-tofu.yaml
    with:
      app-name: ${{github.event.repository.name}}
      state-type: github
      state-name: setup
      working-directory: infra/github
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit    
