name: Apply OpenTofu

on:
  workflow_call:
    inputs:
      app-name:
        description: 'Application name (first segment of the state key)'
        required: true
        type: string
      state-type:
        description: 'State category (second segment of the state key, e.g. github-config, app-deployment)'
        required: true
        type: string
      state-name:
        description: 'Specific instance within the category (third segment of the state key, e.g. setup, production)'
        required: true
        type: string
      working-directory:
        description: 'Path to the OpenTofu root configuration within the calling repo'
        required: true
        type: string

jobs:
  apply-open-tofu:
    runs-on: ubuntu-latest
    environment: ${{ inputs.state-name }}
    permissions:
      contents: read
    env:
      TF_VAR_kad_github_token: ${{ secrets.KAD_GITHUB_TOKEN }}
      TF_VAR_repo_name: ${{github.event.repository.name}}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Generate backend config
        env:
          TOFU_STATE_KEY: ${{ inputs.app-name }}/${{ inputs.state-type }}/${{ inputs.state-name }}/terraform.tfstate
          KAD_CF_R2_ACCESS_KEY_ID: ${{ secrets.KAD_CF_R2_ACCESS_KEY_ID }}
          KAD_CF_R2_SECRET_KEY: ${{ secrets.KAD_CF_R2_SECRET_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.KAD_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > "${{ inputs.working-directory }}/backend.tf" <<EOF
          terraform {
            backend "s3" {
              bucket                      = "kad-products-opentofu-remote-state"
              key                         = "${TOFU_STATE_KEY}"
              region                      = "auto"
              skip_credentials_validation = true
              skip_metadata_api_check     = true
              skip_region_validation      = true
              skip_requesting_account_id  = true
              skip_s3_checksum            = true
              use_path_style              = true
              access_key                  = "${KAD_CF_R2_ACCESS_KEY_ID}"
              secret_key                  = "${KAD_CF_R2_SECRET_KEY}"
              endpoints = {
                s3 = "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
              }
            }
          }
          EOF

      - name: Init and Plan
        working-directory: ${{ inputs.working-directory }}
        run: |
          tofu init -input=false
          tofu plan -input=false -out=/tmp/tfplan

      - name: Apply
        working-directory: ${{ inputs.working-directory }}
        run: tofu apply /tmp/tfplan
