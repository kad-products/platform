name: Create Release

on:
  workflow_call:

jobs:
  create-release:
    runs-on: ubuntu-latest
    concurrency:
      group: create-release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      - run: pnpm install

      - run: |
          curl --fail-with-body -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/branches/${{ github.ref_name }}/protection \
          | jq '{
              restrictions: (if .restrictions then {
                users: [.restrictions.users[].login],
                teams: [.restrictions.teams[].slug]
              } else null end),
              required_status_checks: (if .required_status_checks then {
                strict: .required_status_checks.strict,
                contexts: .required_status_checks.contexts
              } else null end),
              enforce_admins: .enforce_admins.enabled,
              required_pull_request_reviews: (if .required_pull_request_reviews then {
                dismiss_stale_reviews: .required_pull_request_reviews.dismiss_stale_reviews,
                require_code_owner_reviews: .required_pull_request_reviews.require_code_owner_reviews,
                required_approving_review_count: .required_pull_request_reviews.required_approving_review_count
              } else null end),
              allow_deletions: .allow_deletions.enabled,
              allow_force_pushes: .allow_force_pushes.enabled,
              block_creations: .block_creations.enabled
            }' > /tmp/branch-protection.json
        env:
          GITHUB_TOKEN: ${{ secrets.KAD_WORKFLOW_AUTOMATION }}

      - run: |
          curl -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/branches/${{ github.ref_name }}/protection \
            -d '{"restrictions":null,"required_status_checks":null,"enforce_admins":false,"required_pull_request_reviews":null}'
        env:
          GITHUB_TOKEN: ${{ secrets.KAD_WORKFLOW_AUTOMATION }}

      - run: |
          pnpm dlx \
            --package=semantic-release@25 \
            --package=@semantic-release/commit-analyzer@13 \
            --package=@semantic-release/release-notes-generator@14 \
            --package=@semantic-release/changelog@7 \
            --package=@semantic-release/npm@13 \
            --package=@semantic-release/git@11 \
            --package=@semantic-release/github@12 \
            --package=conventional-changelog-conventionalcommits@9 \
            semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.KAD_WORKFLOW_AUTOMATION }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@users.noreply.github.com
          HUSKY: 0

      - if: always()
        run: |
          curl -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/branches/${{ github.ref_name }}/protection \
            -d @/tmp/branch-protection.json
        env:
          GITHUB_TOKEN: ${{ secrets.KAD_WORKFLOW_AUTOMATION }}
