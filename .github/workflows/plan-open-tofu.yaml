name: Plan OpenTofu

on:
  workflow_call:
    inputs:
      app-name:
        description: 'Application name (first segment of the state key)'
        required: true
        type: string
      state-type:
        description: 'State category (second segment of the state key, e.g. github-config, app-deployment)'
        required: true
        type: string
      state-name:
        description: 'Specific instance within the category (third segment of the state key, e.g. setup, production)'
        required: true
        type: string
      working-directory:
        description: 'Path to the OpenTofu root configuration within the calling repo'
        required: true
        type: string

jobs:
  plan-open-tofu:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_VAR_kad_workflow_automation: ${{ secrets.KAD_WORKFLOW_AUTOMATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Generate backend config
        env:
          TOFU_STATE_KEY: ${{ inputs.app-name }}/${{ inputs.state-type }}/${{ inputs.state-name }}/terraform.tfstate
          TOFU_BACKEND_ACCESS_KEY: ${{ secrets.TOFU_BACKEND_ACCESS_KEY_ID }}
          TOFU_BACKEND_SECRET_KEY: ${{ secrets.TOFU_BACKEND_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > "${{ inputs.working-directory }}/backend.tf" <<EOF
          terraform {
            backend "s3" {
              bucket                      = "kad-products-opentofu-remote-state"
              key                         = "${TOFU_STATE_KEY}"
              region                      = "auto"
              skip_credentials_validation = true
              skip_metadata_api_check     = true
              skip_region_validation      = true
              skip_requesting_account_id  = true
              skip_s3_checksum            = true
              use_path_style              = true
              access_key                  = "${TOFU_BACKEND_ACCESS_KEY}"
              secret_key                  = "${TOFU_BACKEND_SECRET_KEY}"
              endpoints = {
                s3 = "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
              }
            }
          }
          EOF

      - name: Init and Plan
        id: plan
        working-directory: ${{ inputs.working-directory }}
        run: |
          tofu init -input=false
          set +o pipefail
          tofu plan -input=false -no-color 2>&1 | tee /tmp/plan_output.txt
          PLAN_EXIT=${PIPESTATUS[0]}
          set -o pipefail
          {
            echo 'output<<PLAN_EOF'
            cat /tmp/plan_output.txt
            echo 'PLAN_EOF'
          } >> $GITHUB_OUTPUT
          {
            echo 'summary<<SUMMARY_EOF'
            grep -E "^  # .+ (will be|must be)" /tmp/plan_output.txt | sed 's/^  # /- /' || true
            echo 'SUMMARY_EOF'
          } >> $GITHUB_OUTPUT
          exit $PLAN_EXIT

      - name: Comment plan failure on PR
        if: steps.plan.outcome != 'success' && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: tofu-plan-${{ inputs.state-name }}
          message: |
            ### ❌ Open Tofu Plan Failed

            ```
            ${{ steps.plan.outputs.output }}
            ```

      - name: Comment plan success on PR
        if: steps.plan.outcome == 'success' && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: tofu-plan-${{ inputs.state-name }}
          message: |
            ### Open Tofu Plan Succeeded

            ${{ steps.plan.outputs.summary == '' && 'ℹ️ No Changes' }}

            ${{ steps.plan.outputs.summary != '' && steps.plan.outputs.summary }}

            <details><summary>Plan output details</summary>

            ```
            ${{ steps.plan.outputs.output }}
            ```

            </details>
